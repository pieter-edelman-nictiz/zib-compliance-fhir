name: 'FHIR-zib compliance'
description: 'Check FHIR profile compliance to the zibs'
inputs:
    max-file:
      description: 'Path to .max file'
      required: true
    structuredefinitions:
      description: 'A glob to the structuredefinition files to check'
      required: true
    zib-release:
      description: 'The zib release to check mappings for'
      required: true
    fhir-version:
      description: 'The FHIR version to use (the "fhirVersion" element in the structuredefinitions will be ignored).\nIf the version is STU3, the definitions should be present in the "definitions" folder.'
      default: 'R4'
    check-missing:
      description: 'Check for missing elements from all zibs ("all"), the zibs that are mapped to the checked profiles ("mapped-only") or none at all ("none").'
      default: all
    fail-at:
      description: The level at which issues are considered fatal (error or warning).
      default: error
    zib-deviations:
      description: 'A YAML file describing, with reason, where the profile may deviate from the zib.'
outputs:
  stats-file:
    description: The location of the JSON file containing statistics about the check.
    value: ${{ steps.run-script.outputs.stats-file }}
  was-skipped:
    description: Indicate whether the check was skipped
    value: ${{ steps.check_run.outputs.run != 'run' }}
runs:
  using: 'composite'
  steps:
    - name: Check for input
      run: |
        do_run=false
        for source in ${{inputs.structuredefinitions}}; do 
          if [[ -f $source ]]; then
            do_run=true
          fi
        done
        if $do_run; then
          echo "run=run| >> $GITHUB_OUTPUT
        else
          echo "No StructureDefinitions to check, skipping"
          echo "run=" $GITHUB_OUTPUT
        fi
      id: check_run
      shell: bash
    - name: Get dependencies
      run: |
        if [ ${{ steps.check_run.outputs.run }} ]; then
          npm install --prefix ${{ github.action_path }} > /dev/null 2> /dev/null
        fi
      shell: bash
    - run: echo opt_zib_deviations=$(if [ ! -z ${{inputs.zib-deviations}} ]; then echo --zib-overrides=${{ inputs.zib-deviations }};fi) >> $GITHUB_OUTPUT
      id: set_options
      shell: bash
    - name: Run script
      id: run-script
      run: |
        stats_file=$(mktemp --suffix=.json)
        echo "stats-file=$stats_file" >> $GITHUB_OUTPUT
        if [ ${{ steps.check_run.outputs.run }} ]; then
          node ${{ github.action_path }}/index.js -m ${{ inputs.max-file }} -z ${{ inputs.zib-release }} -v ${{ inputs.fhir-version }} --check-missing ${{inputs.check-missing }} --fail-at ${{ inputs.fail-at }} ${{ steps.set_options.outputs.opt_zib_deviations }} -f text ${{ inputs.structuredefinitions }} --stats-file=$stats_file
        fi
      shell: bash
